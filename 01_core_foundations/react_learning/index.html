<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReactJS Learning</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="root"></div>

    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Components -->
    <script type="text/babel" src="components/Ch01_JsxComponents.jsx"></script>
    <script type="text/babel" src="components/Ch02_PropsState.jsx"></script>
    <script type="text/babel" src="components/Ch03_Effects.jsx"></script>
    <script type="text/babel" src="components/Ch04_ContextApi.jsx"></script>
    <script type="text/babel" src="components/Ch05_CustomHooks.jsx"></script>
    
    <!-- Main App -->
    <script type="text/babel" src="app.jsx"></script>
</body>
</html>
